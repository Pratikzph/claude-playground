name: Claude Code Issue Fixer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude-fix:
    # Only run on issue comments (not PR comments), and only when @claude is mentioned
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: dev
          branch_prefix: "fix/"
          prompt: |
            After implementing the fix, create a pull request with:
            - Title: a concise "fix: <what was resolved>" title derived from the actual changes made
            - Description structured as:
              ## Summary
              One paragraph explaining what the issue was and how it was fixed.
              ## Changes
              Bullet list of files/functions modified and why.
              ## How to verify
              Step-by-step instructions to confirm the fix works.
              ---
              Closes #${{ github.event.issue.number }}
