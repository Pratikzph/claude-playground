name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    name: Claude AI Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch ref
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet anthropic requests

      - name: Run AI PR Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZPH_PR_NUMBER: ${{ github.event.pull_request.number }}
          ZPH_PR_TITLE: ${{ github.event.pull_request.title }}
          ZPH_PR_BODY: ${{ github.event.pull_request.body }}
          ZPH_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ZPH_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          ZPH_REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, sys, subprocess, re
          import requests
          import anthropic

          zph_api_key      = os.environ["ANTHROPIC_API_KEY"]
          zph_gh_token     = os.environ["GITHUB_TOKEN"]
          zph_pr_number    = os.environ["ZPH_PR_NUMBER"]
          zph_pr_title     = os.environ["ZPH_PR_TITLE"]
          zph_pr_body      = os.environ.get("ZPH_PR_BODY") or "No description provided."
          zph_pr_author    = os.environ["ZPH_PR_AUTHOR"]
          zph_base_branch  = os.environ["ZPH_BASE_BRANCH"]
          zph_repo         = os.environ["ZPH_REPO"]

          zph_diff_proc = subprocess.run(
              ["git", "diff", f"origin/{zph_base_branch}...HEAD"],
              capture_output=True, text=True, check=True,
          )
          zph_raw_diff = zph_diff_proc.stdout

          def zph_filter_binaries(zph_text):
              zph_out, zph_skip = [], False
              for zph_line in zph_text.splitlines():
                  if zph_line.startswith("diff --git"):
                      zph_skip = False
                  if re.search(r"^Binary files .+ differ$", zph_line):
                      zph_skip = True
                      continue
                  if not zph_skip:
                      zph_out.append(zph_line)
              return "\n".join(zph_out)

          zph_diff = zph_filter_binaries(zph_raw_diff)

          if not zph_diff.strip():
              print("No text changes detected — skipping AI review.")
              sys.exit(0)

          ZPH_MAX_CHARS = 28_000
          zph_truncated = len(zph_diff) > ZPH_MAX_CHARS
          if zph_truncated:
              zph_diff = zph_diff[:ZPH_MAX_CHARS]
          zph_diff_block = zph_diff + (
              "\n\n> ⚠️ Diff truncated at ~8 000 tokens — showing the first portion only."
              if zph_truncated else ""
          )

          zph_prompt = (
              "You are a senior software engineer performing a thorough code review.\n\n"
              "## Pull Request\n"
              f"- **Title:** {zph_pr_title}\n"
              f"- **Author:** {zph_pr_author}\n"
              f"- **Description:** {zph_pr_body}\n\n"
              "## Diff\n"
              "```diff\n"
              f"{zph_diff_block}\n"
              "```\n\n"
              "Review the changes above and provide structured feedback in Markdown "
              "covering **all** sections below:\n\n"
              "### 1. Summary\n"
              "One-paragraph overview of what this PR does and your overall verdict.\n\n"
              "### 2. Bugs & Logic Errors\n"
              "List potential bugs, incorrect logic, off-by-one errors, "
              "null/undefined handling issues, or race conditions. "
              "Reference file names and line numbers from the diff where possible. "
              "Write **None found** if the code looks correct.\n\n"
              "### 3. Security Vulnerabilities\n"
              "Check for injection risks, broken authentication, insecure data handling, "
              "exposed secrets, or OWASP Top 10 concerns. "
              "Write **None found** if the code looks clean.\n\n"
              "### 4. Code Style & Best Practices\n"
              "Evaluate naming conventions, DRY principles, readability, "
              "and language-specific idioms.\n\n"
              "### 5. Test Coverage Gaps\n"
              "Identify untested code paths, missing edge cases, or areas that would "
              "benefit from additional tests.\n\n"
              "### 6. Suggested Improvements\n"
              "Provide specific, actionable suggestions. "
              "Include before/after code snippets where helpful.\n\n"
              "Be concise and prioritise high-severity findings. "
              "If a section has no issues, state that clearly."
          )

          zph_client = anthropic.Anthropic(api_key=zph_api_key)
          zph_response = zph_client.messages.create(
              model="claude-sonnet-4-6",
              max_tokens=2048,
              messages=[{"role": "user", "content": zph_prompt}],
          )
          zph_review_text = zph_response.content[0].text

          zph_comment_body = (
              "## [AI Review] Automated Code Review\n\n"
              "> Powered by **Claude claude-sonnet-4-6** &nbsp;·&nbsp; _[AI Review]_\n\n"
              f"{zph_review_text}\n\n"
              "---\n"
              "<sub>This review was generated automatically. "
              "Treat suggestions as advisory — apply your own judgement before acting on them.</sub>"
          )

          zph_gh_api       = f"https://api.github.com/repos/{zph_repo}"
          zph_gh_headers   = {
              "Authorization": f"Bearer {zph_gh_token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          zph_comments_url = f"{zph_gh_api}/issues/{zph_pr_number}/comments"

          zph_existing_id = None
          zph_page = 1
          while True:
              zph_resp = requests.get(
                  zph_comments_url,
                  headers=zph_gh_headers,
                  params={"per_page": 100, "page": zph_page},
              )
              zph_resp.raise_for_status()
              zph_page_data = zph_resp.json()
              if not zph_page_data:
                  break
              for zph_c in zph_page_data:
                  if "[AI Review]" in zph_c.get("body", ""):
                      zph_existing_id = zph_c["id"]
                      break
              if zph_existing_id or len(zph_page_data) < 100:
                  break
              zph_page += 1

          if zph_existing_id:
              zph_upd = requests.patch(
                  f"{zph_gh_api}/issues/comments/{zph_existing_id}",
                  headers=zph_gh_headers,
                  json={"body": zph_comment_body},
              )
              zph_upd.raise_for_status()
              print(f"Updated existing AI review comment #{zph_existing_id}")
          else:
              zph_new = requests.post(
                  zph_comments_url,
                  headers=zph_gh_headers,
                  json={"body": zph_comment_body},
              )
              zph_new.raise_for_status()
              print("Posted new AI review comment")

          print("AI review complete.")
          PYEOF
